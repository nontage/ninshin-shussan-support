// ── 妊娠週数・出生日から「今のstage」を自動判定するヘルパー ──
function computeCurrentWeek(info) {
  if (!info || !info.weekInput || !info.weekInputDate) return null;
  const today = new Date();
  const setDate = new Date(info.weekInputDate);
  const elapsedWeeks = Math.floor((today - setDate) / (7 * 86400000));
  return Math.max(0, info.weekInput + elapsedWeeks);
}

function computeBabyAge(info) {
  if (!info || !info.babyBirthDate) return null;
  const today = new Date();
  const birth = new Date(info.babyBirthDate);
  const days = Math.max(0, Math.floor((today - birth) / 86400000));
  const months = days / 30.44;
  return { days, months };
}

function computeCurrentStageId(info) {
  if (info && info.babyBirthDate) {
    const age = computeBabyAge(info);
    if (age.days < 28) return "newborn";
    if (age.months < 3) return "infant_0_3";
    if (age.months < 6) return "infant_3_6";
    return "infant_6_12";
  }
  const week = computeCurrentWeek(info);
  if (week === null) return "pregnancy_early";
  if (week < 16) return "pregnancy_early";
  if (week < 28) return "pregnancy_middle";
  return "pregnancy_late";
}

function stageDisplayText(info) {
  if (info && info.babyBirthDate) {
    const age = computeBabyAge(info);
    if (age.days < 28) return `生後${age.days}日`;
    return `生後${Math.floor(age.months)}か月`;
  }
  const week = computeCurrentWeek(info);
  return week === null ? "未設定" : `妊娠${week}週`;
}

          <button onClick={() => setOpen((v) => !v)} style={{ border: "none", background: "none", color: "#B7BBA9", cursor: "pointer", padding: 2, flexShrink: 0, fontSize: 10.5, fontFamily: "'Zen Kaku Gothic New', sans-serif", display: "flex", alignItems: "center", gap: 2 }}>
            {doneSubtasks}/{task.subtasks.length}
            <ChevronDown size={14} style={{ transform: open ? "rotate(180deg)" : "none", transition: "transform 0.15s ease" }} />
          </button>
        )}
      </div>
      {open && hasSubtasks && (
        <div style={{ padding: "0 14px 12px", display: "flex", flexDirection: "column", gap: 6 }}>
          {task.subtasks.map((s, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <button onClick={() => onSubtaskToggle(task.id, i)} style={{ border: "none", background: "none", padding: 0, cursor: "pointer" }}>
                <Stamp active={!!state.subtasks[i]} />
              </button>
              <span style={{ fontSize: 12.5, color: "#3E4238", fontFamily: "'Zen Kaku Gothic New', sans-serif", textDecoration: state.subtasks[i] ? "line-through" : "none" }}>
                {s}
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TodoTab({ taskState, setTaskState, pregnancyInfo, setPregnancyInfo }) {
  const accent = ACCENTS.todo.main;
  const currentStageId = computeCurrentStageId(pregnancyInfo);

  const toggle = (id) =>
    setTaskState((prev) => ({ ...prev, [id]: { ...getTaskState(prev, id), done: !getTaskState(prev, id).done } }));
  const subtaskToggle = (id, i) =>
    setTaskState((prev) => {
      const cur = getTaskState(prev, id);
      return { ...prev, [id]: { ...cur, subtasks: { ...cur.subtasks, [i]: !cur.subtasks[i] } } };
    });

  const doneCount = MASTER_TASKS.filter((t) => getTaskState(taskState, t.id).done).length;
  const todayTasks = MASTER_TASKS.filter((t) => t.stage === currentStageId);
  const otherStages = MASTER_STAGES.filter((s) => s.id !== currentStageId).map((s) => ({
    stage: s,
    tasks: MASTER_TASKS.filter((t) => t.stage === s.id),
  })).filter((g) => g.tasks.length > 0);

  return (
    <div>
      <PregnancyInfoBar info={pregnancyInfo} setInfo={setPregnancyInfo} currentStageId={currentStageId} />
      <ProgressBar done={doneCount} total={MASTER_TASKS.length} accent={accent} />

      {todayTasks.length > 0 && (
        <div style={{ marginTop: 18 }}>
          <div style={{ fontFamily: "'Shippori Mincho', serif", fontSize: 13, fontWeight: 700, color: accent, marginBottom: 8, display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: accent }} />
            今やること（{STAGE_NAME[currentStageId]}）
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {todayTasks.map((t) => (
              <TaskCard key={t.id} task={t} state={getTaskState(taskState, t.id)} accent={accent} onToggle={toggle} onSubtaskToggle={subtaskToggle} />
            ))}
          </div>
        </div>
      )}

      {otherStages.map(({ stage, tasks }) => (
        <div key={stage.id} style={{ marginTop: 18 }}>
          <div style={{ fontFamily: "'Shippori Mincho', serif", fontSize: 13, fontWeight: 700, color: "#B4B99F", marginBottom: 8, display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#D3D6C5" }} />
            {stage.name}
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {tasks.map((t) => (
              <TaskCard key={t.id} task={t} state={getTaskState(taskState, t.id)} accent={accent} onToggle={toggle} onSubtaskToggle={subtaskToggle} />
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

const DEFAULT_ITEM_STATE = {
  status: "not_started",
  plannedQuantity: null,
  ownedQuantity: 0,
  plannedPrice: null,
  actualPrice: null,
  preparedBy: "undecided",
  acquisitionMethod: "undecided",
  hospitalProvides: null,
  facilityProvides: null,
  brand: "",
  productName: "",
  shop: "",
  url: "",
  memo: "",

function getItemState(itemState, id) {

function SupplyTab({ itemState, setItemState, pregnancyInfo, setPregnancyInfo }) {
  const accent = ACCENTS.supply.main;
  const currentStageId = computeCurrentStageId(pregnancyInfo);
  const [target, setTarget] = useState("all");
  const [priorities, setPriorities] = useState(() => new Set(Object.keys(ENUM_PRIORITY)));

  const updateItem = (id, patch) =>
    setItemState((prev) => ({ ...prev, [id]: { ...getItemState(prev, id), ...patch } }));
  const toggleFavorite = (id) => updateItem(id, { favorite: !getItemState(itemState, id).favorite });
  const togglePriority = (p) =>
    setPriorities((prev) => {
      const next = new Set(prev);
      if (next.has(p)) next.delete(p);
      else next.add(p);
      return next;
    });

  const visible = MASTER_ITEMS.filter((it) => {
    if (target !== "all" && it.target !== target && it.target !== "shared") return false;
    if (!priorities.has(it.priority)) return false;
    return true;
  });

  const activeItems = (items) => items.filter((it) => !(it.conditional && getItemState(itemState, it.id).needed === false));

  const progressFor = (targets) => {
    const relevant = activeItems(MASTER_ITEMS.filter((it) => targets.includes(it.target)));
    const done = relevant.filter((it) => COMPLETED_STATUSES.includes(getItemState(itemState, it.id).status)).length;
    return { done, total: relevant.length };
  };
  const motherProgress = progressFor(["mother", "shared"]);
  const babyProgress = progressFor(["baby", "shared"]);

  const budget = activeItems(MASTER_ITEMS).reduce(
    (acc, it) => {
      const s = getItemState(itemState, it.id);
      if (s.plannedPrice) acc.planned += s.plannedPrice;
      if (s.actualPrice) acc.actual += s.actualPrice;
      return acc;
    },
    { planned: 0, actual: 0 }
  );

  const todayItems = visible.filter((it) => it.stages.includes(currentStageId));
  const otherItems = visible.filter((it) => !it.stages.includes(currentStageId));
  const otherByCategory = {};
  otherItems.forEach((it) => {
    (otherByCategory[it.category] = otherByCategory[it.category] || []).push(it);
  });

  return (
    <div>
      <PregnancyInfoBar info={pregnancyInfo} setInfo={setPregnancyInfo} currentStageId={currentStageId} />

      <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
        <div style={{ flex: 1, background: "#fff", borderRadius: 10, padding: "8px 10px" }}>
          <div style={{ fontSize: 10.5, color: "#9AA192" }}>母親の準備</div>
          <ProgressBar done={motherProgress.done} total={motherProgress.total} accent={accent} />
        </div>
        <div style={{ flex: 1, background: "#fff", borderRadius: 10, padding: "8px 10px" }}>
          <div style={{ fontSize: 10.5, color: "#9AA192" }}>赤ちゃんの準備</div>
          <ProgressBar done={babyProgress.done} total={babyProgress.total} accent={accent} />
        </div>
      </div>

      <div style={{ background: "#fff", borderRadius: 10, padding: "8px 12px", marginBottom: 12, display: "flex", justifyContent: "space-between", fontSize: 12 }}>
        <span style={{ color: "#5C6355" }}>予定金額合計</span>
        <span style={{ fontWeight: 700, color: "#262B22" }}>¥{budget.planned.toLocaleString()}</span>
        <span style={{ color: "#5C6355" }}>実支出合計</span>
        <span style={{ fontWeight: 700, color: accent }}>¥{budget.actual.toLocaleString()}</span>
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
        {[
          { key: "all", label: "すべて" },
          { key: "mother", label: "母親" },
          { key: "baby", label: "赤ちゃん" },
          { key: "shared", label: "共通" },
        ].map(({ key, label }) => (
          <button
            key={key}
            onClick={() => setTarget(key)}
            style={{
              flex: 1,
              border: `1.5px solid ${target === key ? accent : "#E4E7DC"}`,
              background: target === key ? accent : "#fff",
              color: target === key ? "#fff" : "#5C6355",
              borderRadius: 8,
              padding: "6px 4px",
              fontSize: 11.5,
              fontWeight: 600,
              cursor: "pointer",
            }}
          >
            {label}
          </button>
        ))}
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
        {Object.entries(ENUM_PRIORITY).map(([k, label]) => (
          <button
            key={k}
            onClick={() => togglePriority(k)}
            style={{
              border: `1px solid ${priorities.has(k) ? PRIORITY_COLOR[k] : "#E4E7DC"}`,
              background: priorities.has(k) ? `${PRIORITY_COLOR[k]}18` : "#fff",
              color: priorities.has(k) ? PRIORITY_COLOR[k] : "#B7BBA9",
              borderRadius: 20,
              padding: "4px 10px",
              fontSize: 11,
              cursor: "pointer",
            }}
          >
            {label}
          </button>
        ))}
      </div>

      {todayItems.length > 0 && (
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontFamily: "'Shippori Mincho', serif", fontSize: 13, fontWeight: 700, color: accent, marginBottom: 8 }}>
            今の時期に必要なもの（{STAGE_NAME[currentStageId]}）
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {todayItems.map((it) => (
              <ItemCard key={it.id} item={it} state={getItemState(itemState, it.id)} accent={accent} currentStageId={currentStageId} onUpdate={updateItem} onToggleFavorite={toggleFavorite} />
            ))}
          </div>
        </div>
      )}

      {Object.entries(otherByCategory).map(([cat, items]) => (
        <div key={cat} style={{ marginBottom: 18 }}>
          <div style={{ fontFamily: "'Shippori Mincho', serif", fontSize: 12.5, fontWeight: 700, color: "#B4B99F", marginBottom: 8 }}>
            {CATEGORY_NAME[cat]}
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {items.map((it) => (
              <ItemCard key={it.id} item={it} state={getItemState(itemState, it.id)} accent={accent} currentStageId={currentStageId} onUpdate={updateItem} onToggleFavorite={toggleFavorite} />
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

            style={{
              border: `1.5px solid ${activeBag === b.id ? accent : "#E4E7DC"}`,

          return (

const STORAGE_KEY = "sodate-note:data";

// ─────────────────────────────────────────────────────────
// 無料でも永続化・共有できるようにするための設定。
// Firebase（無料のSparkプラン）のプロジェクトを作って、下の3つを埋めると
// Claudeの有料プランに関係なく、夫婦間でデータが同期されるようになります。
// 空のままなら、これまで通りClaude共有ストレージ（Pro以上）→ダメなら
// この端末だけのローカル保存、の順で自動的にフォールバックします。
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDiCN8bhEJElWQkj1Eev39DUrqsXCnlq4o",
  projectId: "ninsinapp",
};
const FIREBASE_ROOM = "our-family"; // 二人だけの合言葉に変えるとより安心です

async function firestoreLoad() {
  if (!FIREBASE_CONFIG.projectId) return null;
  const url = `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/sodate-note/${FIREBASE_ROOM}?key=${FIREBASE_CONFIG.apiKey}`;
  const res = await fetch(url);
  if (res.status === 404) return null;
  if (!res.ok) {
    const body = await res.text().catch(() => "");
    throw new Error(`HTTP ${res.status}: ${body.slice(0, 200)}`);
  }
  const json = await res.json();
  const raw = json?.fields?.data?.stringValue;
  return raw ? JSON.parse(raw) : null;
}

async function firestoreSave(payload) {
  if (!FIREBASE_CONFIG.projectId) return { ok: false, error: "not configured" };
  const url = `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/sodate-note/${FIREBASE_ROOM}?updateMask.fieldPaths=data&key=${FIREBASE_CONFIG.apiKey}`;
  try {
    const res = await fetch(url, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: { data: { stringValue: JSON.stringify(payload) } } }),
    });
    if (!res.ok) {
      const body = await res.text().catch(() => "");
      return { ok: false, error: `HTTP ${res.status}: ${body.slice(0, 200)}` };
    }
    return { ok: true };
  } catch (e) {
    return { ok: false, error: String(e && e.message ? e.message : e) };
  }
}

function SodateNote() {
  const [tab, setTab] = useState("money");
  const [money, setMoney] = useState(initialMoney);
  const [pregnancyInfo, setPregnancyInfo] = useState({ weekInput: 20, weekInputDate: new Date().toISOString().slice(0, 10), babyBirthDate: "" });
  const [taskState, setTaskState] = useState({});
  const [itemState, setItemState] = useState({});
  const [favorites, setFavorites] = useState(() => new Set());
  const [syncState, setSyncState] = useState("loading"); // loading | synced | saving | error | local
  const [backend, setBackend] = useState("firebase"); // firebase | claude | local
  const [firebaseError, setFirebaseError] = useState("");
  const loadedRef = React.useRef(false);

  const applyPayload = (parsed) => {
    if (!parsed) return;
    if (parsed.money) setMoney(parsed.money);
    if (parsed.pregnancyInfo) setPregnancyInfo(parsed.pregnancyInfo);
    if (parsed.taskState) setTaskState(parsed.taskState);
    if (parsed.itemState) setItemState(parsed.itemState);
    if (parsed.favorites) setFavorites(new Set(parsed.favorites));
  };

  // 初回読み込み：Firebase（無料・プラン非依存）→ Claude共有ストレージ（Pro以上）→ この端末のみ、の順で試す
  React.useEffect(() => {
    let cancelled = false;
    (async () => {
      if (FIREBASE_CONFIG.projectId) {
        try {
          const parsed = await firestoreLoad();
          if (cancelled) return;
          applyPayload(parsed);
          setBackend("firebase");
          setSyncState("synced");
          loadedRef.current = true;
          return;
        } catch (e) {
          if (!cancelled) setFirebaseError(String(e && e.message ? e.message : e));
          // Firebase未設定・接続失敗時はClaudeストレージにフォールバック
        }
      }
      if (window.storage) {
        try {
          const result = await window.storage.get(STORAGE_KEY, true);
          if (cancelled) return;
          if (result && result.value) applyPayload(JSON.parse(result.value));
          setBackend("claude");
          setSyncState("synced");
        } catch (e) {
          setBackend("claude");
          setSyncState("synced");
        } finally {
          loadedRef.current = true;
        }
        return;
      }
      setBackend("local");
      setSyncState("local");
      loadedRef.current = true;
    })();
    return () => {
      cancelled = true;
    };
  }, []);

  // 変更のたびに、使えるバックエンドへ保存
  React.useEffect(() => {
    if (!loadedRef.current) return;
    let cancelled = false;
    const payload = { money, pregnancyInfo, taskState, itemState, favorites: [...favorites] };
    setSyncState("saving");
    (async () => {
      try {
        if (backend === "firebase") {
          const result = await firestoreSave(payload);
          if (cancelled) return;
          if (result.ok) {
            setFirebaseError("");
            setSyncState("synced");
          } else {
            setFirebaseError(result.error || "");
            setSyncState("error");
          }
          return;
        }
        if (backend === "claude" && window.storage) {
          const result = await window.storage.set(STORAGE_KEY, JSON.stringify(payload), true);
          if (!cancelled) setSyncState(result ? "synced" : "error");
          return;
        }
        if (!cancelled) setSyncState("local");
      } catch (e) {
        if (!cancelled) setSyncState("error");
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [money, pregnancyInfo, taskState, itemState, favorites, backend]);

  // Firebase使用時は20秒ごとに相手の変更を取り込む（簡易的なほぼリアルタイム同期）
  React.useEffect(() => {
    if (backend !== "firebase") return;
    const interval = setInterval(async () => {
      try {
        const parsed = await firestoreLoad();
        applyPayload(parsed);
      } catch (e) {
        // 通信エラー時は次回のポーリングに任せる
      }
    }, 20000);
    return () => clearInterval(interval);
  }, [backend]);

  const toggleFavorite = (id) => {
    setFavorites((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const tabs = [
    { key: "money", label: "お金", icon: Wallet },
    { key: "todo", label: "やること", icon: ListChecks },
    { key: "supply", label: "必需品", icon: Package },
    { key: "bags", label: "バッグ", icon: Briefcase },
    { key: "compare", label: "検討比較", icon: Scale },
  ];

  const syncLabel = {
    loading: "読み込み中…",
    saving: "保存中…",
    synced: backend === "firebase" ? "夫婦で共有中（無料・永続）" : backend === "claude" ? "夫婦で共有中（Claude有料プラン）" : "夫婦で共有中",
    error: "保存に失敗しました",
    local: "この端末だけに保存（未設定）",
  }[syncState];

  const syncColor = {
    loading: "#9AA192",
    saving: "#9AA192",
    synced: "#5B8A6B",
    error: "#B23A48",
    local: "#B4791F",
  }[syncState];

  return (
    <div
      style={{
        minHeight: "100vh",
        background: "#EDF0E6",
        display: "flex",
        justifyContent: "center",
        fontFamily: "'Zen Kaku Gothic New', sans-serif",
      }}
    >
      <div style={{ width: "100%", maxWidth: 420, minHeight: "100vh", display: "flex", flexDirection: "column", position: "relative" }}>
        {/* header */}
        <div style={{ padding: "28px 20px 16px" }}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
            <div style={{ fontFamily: "'Shippori Mincho', serif", fontSize: 24, fontWeight: 700, color: "#262B22" }}>
              妊娠・出産サポート
            </div>
            <div
              style={{
                display: "flex",
                alignItems: "center",
                gap: 4,
                fontSize: 10.5,
                color: syncColor,
                fontFamily: "'Zen Kaku Gothic New', sans-serif",
              }}
            >
              <span
                style={{
                  width: 6,
                  height: 6,
                  borderRadius: "50%",
                  background: syncColor,
                  display: "inline-block",
                }}
              />
              {syncLabel}
            </div>
          </div>
          <div style={{ fontSize: 12.5, color: "#7A8072", marginTop: 4 }}>
            妊娠・育児の申請とやることを、ひとつのノートに。
          </div>
          {firebaseError && (
            <div
              style={{
                fontSize: 10.5,
                color: "#B23A48",
                marginTop: 6,
                background: "#F3E3E6",
                borderRadius: 6,
                padding: "4px 8px",
                fontFamily: "monospace",
                wordBreak: "break-all",
              }}
            >
              Firebase接続エラー: {firebaseError}
            </div>
          )}
        </div>

        {/* tab pill switcher */}
        <div style={{ padding: "0 20px", display: "flex", gap: 8, marginBottom: 6 }}>
          {tabs.map(({ key, label, icon: Icon }) => {
            const active = tab === key;
            const accent = ACCENTS[key].main;
            return (
              <button
                key={key}
                onClick={() => setTab(key)}
                style={{
                  flex: 1,
                  border: "none",
                  borderRadius: 12,
                  padding: "9px 3px",
                  background: active ? accent : "#fff",
                  color: active ? "#fff" : "#5C6355",
                  fontSize: 10.5,
                  fontWeight: 600,
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                  gap: 4,
                  whiteSpace: "nowrap",
                  cursor: "pointer",
                  boxShadow: active ? `0 3px 10px ${accent}55` : "0 1px 3px rgba(38,43,34,0.05)",
                  transition: "all 0.15s ease",
                }}
              >
                <Icon size={16} />
                {label}
              </button>
            );
          })}
        </div>

        {/* content */}
        <div style={{ flex: 1, padding: "14px 20px 100px", overflowY: "auto" }}>
          <div
            style={{
              fontFamily: "'Shippori Mincho', serif",
              fontSize: 15,
              fontWeight: 700,
              color: ACCENTS[tab].main,
              marginBottom: 12,
            }}
          >
            {ACCENTS[tab].label}
          </div>
          {tab === "money" && <MoneyTab items={money} setItems={setMoney} />}
          {tab === "todo" && <TodoTab taskState={taskState} setTaskState={setTaskState} pregnancyInfo={pregnancyInfo} setPregnancyInfo={setPregnancyInfo} />}
          {tab === "supply" && <SupplyTab itemState={itemState} setItemState={setItemState} pregnancyInfo={pregnancyInfo} setPregnancyInfo={setPregnancyInfo} />}
          {tab === "bags" && <BagsTab itemState={itemState} setItemState={setItemState} />}
          {tab === "compare" && <CompareTab favorites={favorites} onToggleFavorite={toggleFavorite} />}
        </div>
      </div>
    </div>
  );
}
