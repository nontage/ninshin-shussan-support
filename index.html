function Stamp({ active }) {
  return (
    <span
      style={{
        width: 30,
        height: 30,
        borderRadius: "50%",
        border: `2px solid ${active ? "#B23A48" : "#C9CDC0"}`,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        flexShrink: 0,
        transform: active ? "rotate(-8deg)" : "none",
        transition: "all 0.2s ease",
        background: active ? "rgba(178,58,72,0.06)" : "transparent",
      }}
    >
      {active && (
        <span
          style={{
            fontFamily: "'Shippori Mincho', serif",
            fontSize: 12,
            fontWeight: 700,
            color: "#B23A48",
            letterSpacing: -1,
          }}
        >

        </span>
      )}

function ProgressBar({ done, total, accent }) {
  const pct = total === 0 ? 0 : Math.round((done / total) * 100);
  return (
    <div style={{ width: "100%" }}>
      <div
        style={{
          display: "flex",
          justifyContent: "space-between",
          fontFamily: "'Zen Kaku Gothic New', sans-serif",
          fontSize: 12,
          color: "#5C6355",
          marginBottom: 6,
        }}
      >
        <span>{done} / {total} 完了</span>
        <span>{pct}%</span>
      </div>
      <div style={{ height: 6, borderRadius: 4, background: "#E4E7DC", overflow: "hidden" }}>
        <div
          style={{
            width: `${pct}%`,
            height: "100%",
            background: accent,
            borderRadius: 4,
            transition: "width 0.3s ease",
          }}
        />
      </div>
    </div>
  );
}

            <li key={i}>{p}</li>
          ))}
        </ul>
      </div>

      <div style={{ marginTop: 6, display: "flex", gap: 6, alignItems: "flex-start" }}>
        <ThumbsDown size={13} color="#B08A6A" style={{ marginTop: 2, flexShrink: 0 }} />
        <ul style={{ margin: 0, paddingLeft: 14, fontSize: 12.5, color: "#5C6355", fontFamily: "'Zen Kaku Gothic New', sans-serif", lineHeight: 1.6 }}>
          {item.cons.map((c, i) => (
            <li key={i}>{c}</li>
          ))}
        </ul>
      </div>

      <div
        style={{
          marginTop: 8,
          background: ACCENTS.compare.soft,
          borderRadius: 10,
          padding: "9px 10px",
        }}
      >
        <div style={{ display: "flex", gap: 6, alignItems: "flex-start", marginBottom: item.reviews?.length ? 6 : 0 }}>
          <MessageCircle size={13} color={accent} style={{ marginTop: 2, flexShrink: 0 }} />
          <span style={{ fontSize: 12, color: "#4A4E70", fontFamily: "'Zen Kaku Gothic New', sans-serif", lineHeight: 1.6, fontWeight: 600 }}>
            {item.sns}
          </span>
        </div>
        {item.reviews && item.reviews.length > 0 && (
          <div style={{ display: "flex", flexDirection: "column", gap: 5, paddingLeft: 19 }}>
            {item.reviews.map((r, i) => (
              <div key={i} style={{ fontSize: 11.5, color: "#5C5F80", fontFamily: "'Zen Kaku Gothic New', sans-serif", lineHeight: 1.6 }}>
                <span style={{ color: accent, fontWeight: 600 }}>{r.source}｜</span>
                {r.text}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function CompareTab({ favorites, onToggleFavorite }) {
  const [category, setCategory] = useState("stroller");
  const [view, setView] = useState("card"); // "card" | "list"
  const [expanded, setExpanded] = useState(() => new Set());
  const accent = ACCENTS.compare.main;
  const rawData = category === "stroller" ? strollerData : carrierData;

  const toggleFavorite = (id) => onToggleFavorite(id);

  const toggleExpanded = (id) => {
    setExpanded((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const data = [...rawData].sort((a, b) => {
    const fa = favorites.has(a.id) ? 1 : 0;
    const fb = favorites.has(b.id) ? 1 : 0;
    return fb - fa;
  });

  const favoriteCount = rawData.filter((d) => favorites.has(d.id)).length;

  return (
    <div>
      <div
        style={{
          fontSize: 11.5,
          color: "#7A8072",
          background: "#fff",
          borderRadius: 10,
          padding: "8px 12px",
          marginBottom: 12,
          lineHeight: 1.6,
        }}
      >
        比較サイトや口コミ・SNS上の傾向をまとめたものです（特定の投稿の引用ではありません）。価格や仕様は変わるので、購入前に公式サイトや最新レビューもあわせて確認してください。星マークで「気になる」を付けると一覧の上位に表示されます。
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
        {[
          { key: "stroller", label: `ベビーカー（${strollerData.length}）` },
          { key: "carrier", label: `抱っこ紐（${carrierData.length}）` },
        ].map(({ key, label }) => {
          const active = category === key;
          return (
            <button
              key={key}
              onClick={() => setCategory(key)}
              style={{
                flex: 1,
                border: `1.5px solid ${active ? accent : "#E4E7DC"}`,
                borderRadius: 10,
                padding: "8px 6px",
                background: active ? accent : "#fff",
                color: active ? "#fff" : "#5C6355",
                fontSize: 12.5,
                fontWeight: 600,
                cursor: "pointer",
                fontFamily: "'Zen Kaku Gothic New', sans-serif",
              }}
            >
              {label}
            </button>
          );
        })}
      </div>

      <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 12 }}>
        <div style={{ display: "flex", background: "#E4E7DC55", borderRadius: 8, padding: 2 }}>
          {[
            { key: "card", label: "カード表示" },
            { key: "list", label: "名前だけ" },
          ].map(({ key, label }) => {
            const active = view === key;
            return (
              <button
                key={key}
                onClick={() => setView(key)}
                style={{
                  border: "none",
                  borderRadius: 7,
                  padding: "5px 10px",
                  background: active ? "#fff" : "transparent",
                  color: active ? "#262B22" : "#8A8F7E",
                  fontSize: 11.5,
                  fontWeight: 600,
                  cursor: "pointer",
                  fontFamily: "'Zen Kaku Gothic New', sans-serif",
                  boxShadow: active ? "0 1px 2px rgba(38,43,34,0.1)" : "none",
                }}
              >
                {label}
              </button>
            );
          })}
        </div>
      </div>

      {favoriteCount > 0 && (
        <div
          style={{
            display: "flex",
            alignItems: "center",
            gap: 6,
            marginBottom: 10,
            fontSize: 12,
            color: "#8A6A1F",
            fontFamily: "'Zen Kaku Gothic New', sans-serif",
          }}
        >
          <Star size={13} color="#E0A83A" fill="#E0A83A" />
          気になる：{favoriteCount}件を上位に表示中
        </div>
      )}

      {view === "card" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {data.map((item) => (
            <CompareCard
              key={item.id}
              item={item}
              accent={accent}
              category={category}
              favorite={favorites.has(item.id)}
              onToggleFavorite={toggleFavorite}
            />
          ))}
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {data.map((item) => {
            const isOpen = expanded.has(item.id);
            return (
              <div key={item.id} style={{ background: "#fff", borderRadius: 12, overflow: "hidden" }}>
                <button
                  onClick={() => toggleExpanded(item.id)}
                  style={{
                    width: "100%",
                    border: "none",
                    background: "transparent",
                    padding: "11px 12px",
                    display: "flex",
                    alignItems: "center",
                    gap: 8,
                    cursor: "pointer",
                    textAlign: "left",
                  }}
                >
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      toggleFavorite(item.id);
                    }}
                    style={{ border: "none", background: "none", padding: 0, cursor: "pointer", flexShrink: 0 }}
                  >
                    <Star
                      size={16}
                      color={favorites.has(item.id) ? "#E0A83A" : "#D8DBCF"}
                      fill={favorites.has(item.id) ? "#E0A83A" : "none"}
                    />
                  </button>
                  <span style={{ flex: 1, fontFamily: "'Zen Kaku Gothic New', sans-serif", fontSize: 13.5, fontWeight: 600, color: "#262B22" }}>
                    {item.name}
                  </span>
                  <span style={{ fontSize: 11, color: "#9AA192", fontFamily: "'Zen Kaku Gothic New', sans-serif" }}>{item.price}</span>
                  <ChevronDown
                    size={15}
                    color="#B7BBA9"
                    style={{ transform: isOpen ? "rotate(180deg)" : "none", transition: "transform 0.15s ease", flexShrink: 0 }}
                  />
                </button>
                {isOpen && (
                  <div style={{ padding: "0 12px 14px" }}>
                    <CompareCard
                      item={item}
                      accent={accent}
                      category={category}
                      favorite={favorites.has(item.id)}
                      onToggleFavorite={toggleFavorite}
                      bare
                    />
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── データの保存先：無料のFirebase（プロジェクト: ninsinapp）を使い、
// 夫婦間でリアルタイムに近い形で共有します。Claudeの課金状況とは無関係に動きます。
const FIREBASE_ROOM = "our-family"; // 二人だけの合言葉に変えたい場合はここを書き換えてください
const docRef = firebase.firestore().collection("sodate-note").doc(FIREBASE_ROOM);

function SodateNote() {
  const [tab, setTab] = useState("money");
  const [money, setMoney] = useState(initialMoney);
  const [todo, setTodo] = useState(initialTodo);
  const [supply, setSupply] = useState(initialSupply);
  const [favorites, setFavorites] = useState(() => new Set());
  const [syncState, setSyncState] = useState("loading"); // loading | synced | saving | error
  const [firebaseError, setFirebaseError] = useState("");
  const loadedRef = React.useRef(false);
  const lastWrittenRef = React.useRef("");

  const applyPayload = (parsed) => {
    if (!parsed) return;
    if (parsed.money) setMoney(parsed.money);
    if (parsed.todo) setTodo(parsed.todo);
    if (parsed.supply) setSupply(parsed.supply);
    if (parsed.favorites) setFavorites(new Set(parsed.favorites));
  };

  // リアルタイム購読：自分か夫がどちらかで変更すると、両方の画面が自動的に更新される
  React.useEffect(() => {
    const unsubscribe = docRef.onSnapshot(
      (snap) => {
        const raw = snap.exists ? snap.data().payload : null;
        if (raw && raw !== lastWrittenRef.current) {
          try {
            applyPayload(JSON.parse(raw));
          } catch (e) {
            // 壊れたデータは無視
          }
        }
        setSyncState("synced");
        setFirebaseError("");
        loadedRef.current = true;
      },
      (err) => {
        setSyncState("error");
        setFirebaseError(String(err && err.message ? err.message : err));
        loadedRef.current = true;
      }
    );
    return () => unsubscribe();
  }, []);

  // 変更のたびにFirestoreへ保存
  React.useEffect(() => {
    if (!loadedRef.current) return;
    const payload = JSON.stringify({ money, todo, supply, favorites: [...favorites] });
    if (payload === lastWrittenRef.current) return;
    lastWrittenRef.current = payload;
    setSyncState("saving");
    docRef
      .set({ payload }, { merge: true })
      .then(() => setSyncState("synced"))
      .catch((err) => {
        setSyncState("error");
        setFirebaseError(String(err && err.message ? err.message : err));
      });
  }, [money, todo, supply, favorites]);

  const toggleFavorite = (id) => {
    setFavorites((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const tabs = [
    { key: "money", label: "お金", icon: Wallet },
    { key: "todo", label: "やること", icon: ListChecks },
    { key: "supply", label: "必需品", icon: Package },
    { key: "compare", label: "検討比較", icon: Scale },
  ];

  const syncLabel = {
    loading: "読み込み中…",
    saving: "保存中…",
    synced: "夫婦で共有中（無料・永続）",
    error: "保存に失敗しました",
    local: "この端末だけに保存（未設定）",
  }[syncState];

  const syncColor = {
    loading: "#9AA192",
    saving: "#9AA192",
    synced: "#5B8A6B",
    error: "#B23A48",
    local: "#B4791F",
  }[syncState];

  return (
    <div
      style={{
        minHeight: "100vh",
        background: "#EDF0E6",
        display: "flex",
        justifyContent: "center",
        fontFamily: "'Zen Kaku Gothic New', sans-serif",
      }}
    >
      <div style={{ width: "100%", maxWidth: 420, minHeight: "100vh", display: "flex", flexDirection: "column", position: "relative" }}>
        {/* header */}
        <div style={{ padding: "28px 20px 16px" }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            <div style={{ fontFamily: "'Shippori Mincho', serif", fontSize: 19, fontWeight: 700, color: "#262B22", lineHeight: 1.3 }}>
              妊娠・出産サポート
            </div>
            <div
              style={{
                display: "flex",
                alignItems: "center",
                gap: 4,
                fontSize: 10.5,
                color: syncColor,
                fontFamily: "'Zen Kaku Gothic New', sans-serif",
              }}
            >
              <span
                style={{
                  width: 6,
                  height: 6,
                  borderRadius: "50%",
                  background: syncColor,
                  display: "inline-block",
                }}
              />
              {syncLabel}
            </div>
          </div>
          <div style={{ fontSize: 12.5, color: "#7A8072", marginTop: 4 }}>
            妊娠・育児の申請とやることを、ひとつのノートに。
          </div>
          {firebaseError && (
            <div
              style={{
                fontSize: 10.5,
                color: "#B23A48",
                marginTop: 6,
                background: "#F3E3E6",
                borderRadius: 6,
                padding: "4px 8px",
                fontFamily: "monospace",
                wordBreak: "break-all",
              }}
            >
              Firebase接続エラー: {firebaseError}
            </div>
          )}
        </div>

        {/* tab pill switcher */}
        <div style={{ padding: "0 20px", display: "flex", gap: 8, marginBottom: 6 }}>
          {tabs.map(({ key, label, icon: Icon }) => {
            const active = tab === key;
            const accent = ACCENTS[key].main;
            return (
              <button
                key={key}
                onClick={() => setTab(key)}
                style={{
                  flex: 1,
                  border: "none",
                  borderRadius: 12,
                  padding: "9px 3px",
                  background: active ? accent : "#fff",
                  color: active ? "#fff" : "#5C6355",
                  fontSize: 10.5,
                  fontWeight: 600,
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                  gap: 4,
                  whiteSpace: "nowrap",
                  cursor: "pointer",
                  boxShadow: active ? `0 3px 10px ${accent}55` : "0 1px 3px rgba(38,43,34,0.05)",
                  transition: "all 0.15s ease",
                }}
              >
                <Icon size={16} />
                {label}
              </button>
            );
          })}
        </div>

        {/* content */}
        <div style={{ flex: 1, padding: "14px 20px 100px", overflowY: "auto" }}>
          <div
            style={{
              fontFamily: "'Shippori Mincho', serif",
              fontSize: 15,
              fontWeight: 700,
              color: ACCENTS[tab].main,
              marginBottom: 12,
            }}
          >
            {ACCENTS[tab].label}
          </div>
          {tab === "money" && <MoneyTab items={money} setItems={setMoney} />}
          {tab === "todo" && <TodoTab items={todo} setItems={setTodo} />}
          {tab === "supply" && <SupplyTab items={supply} setItems={setSupply} />}
          {tab === "compare" && <CompareTab favorites={favorites} onToggleFavorite={toggleFavorite} />}
        </div>
      </div>
    </div>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<SodateNote />);

</script>
</body>
</html>
